<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/top :: head"></head>
<body>
    <div th:replace="fragments/top :: body"></div>
    <div class="container mt-5">
        <h1 class="text-center">Config Table</h1>
        <table class="table table-striped table-bordered mt-4">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>App Name</th>
                    <th>Activated</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="config : ${configList}">
                    <td th:text="${config.id}"></td>
                    <td th:text="${config.appName}"></td>
                    <td th:text="${config.activated}"></td>
                </tr>
            </tbody>
        </table>
    </div>
    <div th:replace="fragments/bottom :: footer"></div>
</body>
</html>
